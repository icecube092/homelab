- name: Set WAL-G architecture
  ansible.builtin.set_fact:
    wal_g_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'aarch64'
        }.get(ansible_architecture, '')
      }}

- name: Check supported WAL-G architecture
  ansible.builtin.assert:
    that:
      - wal_g_arch != ''
    fail_msg: "Unsupported architecture: {{ ansible_architecture }}"

- name: Download WAL-G
  ansible.builtin.get_url:
    url: "https://github.com/wal-g/wal-g/releases/download/v3.0.9/wal-g-pg-20.04-{{ wal_g_arch }}.tar.gz"
    dest: /tmp/wal-g.tar.gz
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0755"

- name: Create WAL-G directory
  ansible.builtin.file:
    path: /opt/wal-g
    state: directory
    mode: "0755"

- name: Extract WAL-G
  ansible.builtin.unarchive:
    src: /tmp/wal-g.tar.gz
    dest: /opt/wal-g
    remote_src: true

- name: Install WAL-G binary
  ansible.builtin.copy:
    src: /opt/wal-g/wal-g-pg-20.04-amd64
    dest: /opt/wal-g/wal-g
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Verify WAL-G
  ansible.builtin.command:
    cmd: /opt/wal-g/wal-g --version

- name: Check PostgreSQL archive_mode
  ansible.builtin.command:
    cmd: >
      docker exec {{ service_name }}_postgres
      psql
      -U {{ vars[service_name].db_username }}
      -d {{ vars[service_name].db_database_name }}
      -tAc "SHOW archive_mode"
  register: archive_mode
  changed_when: false

- name: Configure WAL archiving
  ansible.builtin.command:
    cmd: >
      docker exec -i {{ service_name }}_postgres
      psql
      -U {{ vars[service_name].db_username }}
      -d {{ vars[service_name].db_database_name }}
    stdin: |
      ALTER SYSTEM SET archive_mode = 'on';
      ALTER SYSTEM SET archive_command = 'wal-g wal-push %p';
      ALTER SYSTEM SET archive_timeout = '300';
      ALTER SYSTEM SET wal_level = 'replica';
  when: archive_mode.stdout | trim != "on"

- name: Restart PostgreSQL
  ansible.builtin.command:
    cmd: docker restart {{ service_name }}_postgres
  when: archive_mode.stdout | trim != "on"

- name: Check WAL-G from container
  ansible.builtin.command:
    cmd: docker exec {{ service_name }}_postgres wal-g --version

- name: Create WAL-G base backup script
  template:
    src: walg/backup.sh.j2
    dest: "{{local_apps_path}}/{{service_name}}/wal-g-backup.sh"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0755"

- name: Create WAL-G cron job
  ansible.builtin.cron:
    name: "WAL-G backup for {{ service_name }}"
    user: "{{ansible_user}}"
    job: "{{local_apps_path}}/{{service_name}}/wal-g-backup.sh"
    minute: "{{ vars[service_name].backups.walg.cron_schedule.split(' ')[0] }}"
    hour: "{{ vars[service_name].backups.walg.cron_schedule.split(' ')[1] }}"
    day: "{{ vars[service_name].backups.walg.cron_schedule.split(' ')[2] }}"
    month: "{{ vars[service_name].backups.walg.cron_schedule.split(' ')[3] }}"
    weekday: "{{ vars[service_name].backups.walg.cron_schedule.split(' ')[4] }}"
