- name: Set WAL-G architecture
  ansible.builtin.set_fact:
    wal_g_arch: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'aarch64'
        }.get(ansible_architecture, '')
      }}

- name: Check supported WAL-G architecture
  ansible.builtin.assert:
    that:
      - wal_g_arch != ''
    fail_msg: "Unsupported architecture: {{ ansible_architecture }}"

- name: Download WAL-G
  ansible.builtin.get_url:
    url: "https://github.com/wal-g/wal-g/releases/download/latest/wal-g-pg-20.04-{{ wal_g_arch }}"
    dest: /opt/wal-g/wal-g
    owner: root
    group: root
    mode: "0755"

- name: Verify WAL-G
  ansible.builtin.command:
    cmd: /opt/wal-g/wal-g --version

- name: Exec SQL to enable WAL archiving
  ansible.builtin.command:
    cmd: |
      docker exec -i {{service_name}}_postgres bash -c
      "psql -U {{vars[service_name].db_username}} -d {{vars[service_name].db_database_name}} -c
      \"ALTER SYSTEM SET archive_mode = 'on';
      ALTER SYSTEM SET archive_command = 'wal-g wal-push %p';
      ALTER SYSTEM SET archive_timeout = '300';
      ALTER SYSTEM SET wal_level = 'replica';\"
      "

- name: Create WAL-G base backup script
  template:
    dest: "{{local_apps_path}}/{{service_name}}/wal-g-backup.sh"
    content: |
      #!/bin/bash
      docker exec -u {{vars[service_name].db_username}} {{service_name}}_postgres bash wal-g backup-push /var/lib/postgresql/data
      docker exec -u {{vars[service_name].db_username}} {{service_name}}_postgres bash wal-g delete retain FULL {{vars[service_name].backups.wal-g.max_base_bakups}} --confirm
      docker exec -u {{vars[service_name].db_username}} {{service_name}}_postgres bash wal-g wal-verify integrity
    owner: root
    group: root
    mode: "0755"

- name: Create WAL-G cron job
  ansible.builtin.cron:
    name: "WAL-G backup for {{ service_name }}"
    user: "{{ansible_user}}"
    job: "{{local_apps_path}}/{{service_name}}/wal-g-backup.sh"
    minute: "{{ vars[service_name].backups.wal-g.cron_schedule.split(' ')[0] }}"
    hour: "{{ vars[service_name].backups.wal-g.cron_schedule.split(' ')[1] }}"
    day: "{{ vars[service_name].backups.wal-g.cron_schedule.split(' ')[2] }}"
    month: "{{ vars[service_name].backups.wal-g.cron_schedule.split(' ')[3] }}"
    weekday: "{{ vars[service_name].backups.wal-g.cron_schedule.split(' ')[4] }}"
